services:
  sniff_core:
    build: .
    container_name: sniff
    network_mode: host
    ipc: host
    privileged: true # Krytyczne dla robota: daje dostęp do portów USB, I2C, GPIO Jetsona
    # runtime: nvidia # Zostawiamy zakomentowane, dopóki nie dodasz kamery głębi
    environment:
      - DISPLAY=:1
      # - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
    volumes:
      # Mapowanie GUI (np. do odpalenia RViz2 na ekranie podpiętym do Jetsona)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:rw
      # Główny katalog z Twoim kodem: modyfikujesz na Jetsonie, odpala się w kontenerze
      - ./ros2_ws:/ros2_ws
      - /dev:/dev
    command: /bin/bash
    tty: true
    stdin_open: true
