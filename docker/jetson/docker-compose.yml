services:
  sniff_core:
    build: .
    container_name: sniff_robot
    network_mode: host
    ipc: host
    privileged: true 
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
    volumes:
      - ../../ros2_ws:/ros2_ws
      - /dev:/dev
    command: /bin/bash
    tty: true
    stdin_open: true